<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="favicon.ico">
<title>BA Spine Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-color: #1a1c23;
    --card-bg: #262933;
    --accent-blue: #2b6cb0;
    --accent-light: #5aa9ff;
    --text-main: #eeeeee;
    --text-dim: #a0aec0;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Noto Sans KR', sans-serif;
    background-color: var(--bg-color);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 56px 20px 40px;
    overflow-x: hidden;
  }

  body::before {
    content: "";
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 38vh;
    background:
      linear-gradient(180deg, transparent 0%, rgba(20,60,90,0.10) 100%);
    pointer-events: none;
    z-index: 0;
  }

  .page {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 960px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 6px;
  }

  .brand img {
    width: 46px;
    height: 46px;
    border-radius: 14px;
    background: #fff;
    padding: 4px;
    box-shadow: 0 6px 14px rgba(18,50,77,0.25);
  }

  h1 {
    font-family: 'Jua', 'Noto Sans KR', sans-serif;
    font-weight: 400;
    font-size: 2.3rem;
    color: var(--text-main);
    margin: 0;
    text-align: center;
    text-shadow: 0 2px 0 rgba(255,255,255,0.5);
  }

  .subtitle {
    color: var(--text-main);
    font-size: 0.90rem;
    margin: 10px 0 30px;
    background: rgba(255, 255, 255, 0.164);
    padding: 6px 16px;
    border-radius: 50px;
    font-weight: 500;
  }

  .console-divider {
    display: flex;
    align-items: center;
    gap: 18px;
    width: 100%;
    margin: 4px 0 28px;
    color: var(--text-main);
  }
  .console-divider::before,
  .console-divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(237, 247, 255, 0.25), transparent);
  }
  .console-divider span {
    display: flex;
    gap: 10px;
    font-size: 0.9rem;
    letter-spacing: 2px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 24px;
    width: 115%;
  }

  @media (max-width: 820px) {
    .grid { grid-template-columns: 1fr; max-width: 420px; }
  }

  .card {
    position: relative;
    aspect-ratio: 5/7;
    border-radius: 26px;
    overflow: hidden;
    cursor: pointer;
    box-shadow: 0 14px 26px rgba(15,45,70,0.22);
    transition: transform 0.28s cubic-bezier(.25,.8,.25,1), box-shadow 0.28s ease;
  }

  .card:hover, .card:focus-visible {
    transform: translateY(-8px);
    box-shadow: 0 22px 36px rgba(15,45,70,0.32);
    outline: none;
  }

  .card-art {
    position: absolute;
    inset: 0;
    overflow: hidden;
  }

  .card-art img { object-fit: cover; object-position: center 0%; width: 100%; height: 100%; }

  .card-scrim {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, transparent 38%, rgba(9,22,35,0.86) 100%);
  }

  .badge {
    position: absolute;
    top: 16px;
    left: 16px;
    padding: 6px 14px;
    border-radius: 50px;
    font-size: 0.78rem;
    font-weight: 700;
    box-shadow: 0 4px 8px rgba(0,0,0,0.15);
  }
  .badge.pink { background: var(--pill-pink); color: var(--pill-pink-ink); }
  .badge.yellow { background: var(--pill-yellow); color: var(--pill-yellow-ink); }
  .badge.grey { background: var(--pill-grey); color: var(--pill-grey-ink); }

  .card-body {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 20px;
    color: #fff;
  }

  .card-title {
    font-family: 'Jua', 'Noto Sans KR', sans-serif;
    font-weight: 400;
    font-size: 1.35rem;
    margin: 0 0 4px;
  }

  .card-desc {
    font-size: 0.85rem;
    color: rgba(255,255,255,0.85);
    line-height: 1.4;
    margin: 0;
  }

  footer {
    position: relative;
    z-index: 1;
    margin-top: 44px;
    text-align: center;
    color: var(--text-main);
    font-size: 0.78rem;
    line-height: 1.7;
  }
</style>
</head>
<body>

<div class="page">
  <div class="brand">
    <img src="favicon.ico" alt="">
    <h1>BA Spine Viewer</h1>
  </div>
  <p class="subtitle">해당 뷰어는 PC 크롬에 최적화 되어 있습니다.</p>

  <div class="console-divider"><span>△ ✕ + ⊙</span></div>

  <div class="grid">

    <div class="card" style="background-color: rgba(255, 255, 255, 0.288);" onclick="location.href='./new'" tabindex="0" role="button" aria-label="스탠딩 뷰어로 이동">
      <div class="card-art">
        <img src="spine.png"></img>
      </div>
      <div class="card-scrim"></div>
      <div class="card-body">
        <p class="card-title">스탠딩</p>
        <p class="card-desc">캐릭터 스탠딩 애니메이션 뷰어</p>
      </div>
    </div>

    <div class="card" style="background-color: #556570;" onclick="location.href='./old'" tabindex="0" role="button" aria-label="스탠딩 구버전 뷰어로 이동">
      <div class="card-art">
        <img src="spine_old.png" style="height:230%; transform:translateY(-80px)">
      </div>
      <div class="card-scrim"></div>
      <div class="card-body">
        <p class="card-title">스탠딩 (구버전)</p>
        <p class="card-desc">더미 데이터, 구버전 스탠딩 뷰어</p>
      </div>
    </div>

    <div class="card" onclick="location.href='./memorial'" tabindex="0" role="button" aria-label="메모리얼 및 스토리 컷씬 뷰어로 이동">
      <div class="card-art">
        <img src="memorial.png"  style="width: 200%; height: 150%; transform:translate(-230px, -130px)">
      </div>
      <div class="card-scrim"></div>
      <div class="card-body">
        <p class="card-title">메모리얼 &amp; 스토리 컷씬</p>
        <p class="card-desc">메모리얼 로비 및 스토리 컷씬, 기타 뷰어</p>
      </div>
    </div>

  </div>

  <footer>
    모든 에셋과 리소스는 © NEXON Games Co., Ltd. &amp; NEXON Korea Corp.의 자산입니다.
  </footer>
</div>

</body>
</html>
