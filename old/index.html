<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>BA Spine Viewer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" href="../favicon.ico">
    <link rel="stylesheet" href="spine-player.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #12324d;
            --ink-soft: #3a5c78;
            --accent-blue: #447fbe;
            --pill-pink: #ffc2da;
            --pill-pink-ink: #9c3868;
        }

        * { box-sizing: border-box; }

        body {
            background-color: black;
            color: #eee;
            font-family: 'Noto Sans KR', sans-serif;
            margin: 0;
            overflow: hidden;
            display: flex;
        }

        #menu-toggle, #menu-toggle_right {
            position: fixed;
            top: 18px;
            z-index: 1001;
            background-color: rgb(223, 223, 223);
            color: white;
            border: none;
            padding: 11px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-family: 'Jua', 'Noto Sans KR', sans-serif;
            font-weight: 400;
            font-size: 14px;
            color: #000;
            box-shadow: 0 6px 14px rgba(0,0,0,0.35);
            transition: transform 0.2s ease;
        }
        #menu-toggle:hover, #menu-toggle_right:hover { transform: translateY(-2px); }
        #menu-toggle { left: 18px; }
        #menu-toggle_right { right: 18px; }

        #sidebar, #sidebar_right {
            position: fixed;
            top: 0;
            height: 100vh;
            width: 300px;
            background: rgb(53, 53, 53);
            color: var(--ink);
            box-shadow: 0 0 30px rgba(0,0,0,0.45);
            transition: left 0.32s cubic-bezier(.25,.8,.25,1), right 0.32s cubic-bezier(.25,.8,.25,1);
            z-index: 1000;
            padding: 70px 18px 20px 18px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 14px;
            overflow-y: auto;
        }
        #sidebar { left: -320px; border-radius: 0 22px 22px 0;}
        #sidebar_right { right: -320px; width: 280px; border-radius: 22px 0 0 22px;}
        #sidebar.open { left: 0; }
        #sidebar_right.open { right: 0; }

        #sidebar label {
            font-family: 'Jua', 'Noto Sans KR', sans-serif;
            font-size: 15px;
            color: var(--ink-soft);
        }

        .slider-header span, .section-pill {
            display: inline-block;
            font-family: 'Jua', 'Noto Sans KR', sans-serif;
            font-weight: 400;
            font-size: 13px;
            background: var(--pill-pink);
            color: var(--pill-pink-ink);
            padding: 5px 13px;
            border-radius: 10px;
        }
        .anim-container-wrapper .slider-header span { background: rgb(70, 70, 70); color: rgb(221, 221, 221) }

        #player-container {
            width: 100vw;
            height: 100vh;
            background-color: transparent;
            touch-action: none;
        }

        #player-container canvas {
            position: absolute;
            width: 200% !important;
            height: 200% !important;
            left: -50%;
            top: -50%;
            transform: scale(0.5);
            transform-origin: center center;
        }

        .search-container { position: relative; width: 100%; }
        #charSearch {
            width: 100%;
            padding: 12px 16px;
            border-radius: 10px;
            background: #fff;
            color: var(--ink);
            border: 1px solid #cfe1f0;
            outline: none;
            box-sizing: border-box;
            font-size: 14px;
        }
        #charSearch:focus { border-color: var(--accent-blue); box-shadow: 0 0 0 3px rgba(43,108,176,0.15); }
        #charSearch::placeholder { color: #9fb4c6; }

        .options-list {
            position: absolute; top: 52px; left: 0; width: 100%; max-height: 600px;
            background: rgb(39, 39, 39);
            overflow-y: auto; z-index: 1100; display: none;
            box-shadow: 0 14px 28px rgba(18,50,77,0.22);
            padding: 6px;
        }

        .options-list.show {
            display: block;
        }

        .option-item {
            padding: 10px 8px;
            cursor: pointer;
            font-size: 13px;
            border-radius: 10px;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .option-item span {
            width: 100%;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 15px;
            font-weight: 500;
            color:white;
        }

        .option-item:hover {
            background: rgb(79, 80, 156);
        }

        .option-item.hidden {
            display: none !important;
        }

        .btn-group { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }

        button.action-btn {
            padding: 8px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            color: rgb(0, 0, 0);
            background: rgb(100, 189, 219);
            font-weight: bold;
            width: 100%;
            box-shadow: 0 6px 12px rgba(18,50,77,0.25);
            transition: transform 0.18s ease;
        }
        button.action-btn:hover { transform: translateY(-2px); }

        .anim-container-wrapper {
            background: rgba(255, 255, 255, 0.192);
            padding: 12px;
            border-radius: 10px;
            margin-top: 4px;
        }

        #animation-list {
            max-height: 150px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 10px;
        }

        #animation-list::-webkit-scrollbar{ width: 6px; }
        #animation-list::-webkit-scrollbar-thumb{
            background: #b9cfe0;
            border-radius: 10px;
        }

        #animation-list button {
            width: 99%;
            min-height: 34px;
            padding: 0 15px;

            background: #ffffff;
            color: var(--ink);
            border: 1px solid #dbe8f2;
            border-radius: 10px;
            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: flex-start;

            font-size: 14px;
            font-weight: bold;
            line-height: 1;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: all 0.2s;
        }

        #animation-list button:hover {
            background: #eaf3fb;
            border-color: var(--accent-blue);
        }

        #animation-list button.active {
            background: #839dc5;
            border-color: #839dc5;
            color: #ffffff;
        }
    </style>
</head>
<body>
<body>

    <button id="menu-toggle" onclick="toggleSidebar()">☰ 전체 설정</button>
    <button id="menu-toggle_right" onclick="toggleSidebarRight()">☰ 파츠 투명도</button>

    <div id="sidebar_right">
        <div class="anim-container-wrapper">
            <div class="slider-header" style="margin-bottom: 10px;">
                <span>파츠 투명도</span>
            </div>
            <div id="slot-sliders-container" style="overflow-y: auto; max-height: 75vh; padding-right: 6px;">
            </div>
        </div>
    </div>

    <div id="sidebar">
        <div class="search-container">
            <input type="text" id="charSearch" placeholder="캐릭터 검색" style="color:black;" autocomplete="off">
            <div id="options-list" class="options-list"></div>
        </div>

        <div class="btn-group">
            <button class="action-btn" onclick="toggleFullscreen()">전체화면</button>
            <button class="action-btn" onclick="takeScreenshot()">이미지 다운로드</button>
        </div>

        <div class="anim-container-wrapper">
            <div class="slider-header" style="margin-bottom: 10px;">
                <span>애니메이션 목록</span>
            </div>
            <div id="animation-list"></div>
        </div>
        <button class="action-btn" onclick="location.href='../'">메인으로</button>
    </div>

    <div id="viewer-container">
        <div id="player-container"></div>
    </div>

    <script src="spine-player.js"></script>
    
    <script>
        let player = null;
        let selectedCharacter = "nagisa_spr";

        function buildAnimationList(player) {
            const list = document.getElementById("animation-list");
            list.innerHTML = "";

            const animations = player.skeleton.data.animations;
            const animNames = animations.map(a => a.name);

            const processedBases = new Set();

            animations.forEach(anim => {
                const name = anim.name;
                
                const match = name.match(/(.+?)(_[AM])/);
                let displayName = name;
                let isSet = false;
                let baseName = name;

                if (match) {
                    baseName = match[1];
                    displayName = baseName;
                    isSet = true;
                    
                    if (processedBases.has(baseName)) return;
                    processedBases.add(baseName);
                }

                const btn = document.createElement("button");
                btn.textContent = displayName;

                btn.onclick = () => {
                    Array.from(list.children).forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');

                    if (isSet) {
                        const animM = baseName + "_M";
                        const animA = baseName + "_A";

                        player.animationState.setAnimation(1, animM, true);
                        if (animNames.includes(animA)) {
                            player.animationState.setAnimation(2, animA, true);
                        }
                    }
                    else {
                        player.animationState.setAnimation(1, name, true);
                        player.animationState.setEmptyAnimation(2, 0.2);
                    }
                };
                list.appendChild(btn);
            });
            
        }

        function toggleFullscreen() {
            const container = document.getElementById('player-container');

            if (!document.fullscreenElement) {
                if (container.requestFullscreen) {
                container.requestFullscreen();
                } else if (container.webkitRequestFullscreen) {
                container.webkitRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                document.webkitExitFullscreen();
                }
            }
            }


        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const toggleBtn = document.getElementById('menu-toggle');
            sidebar.classList.toggle('open');
            toggleBtn.innerText = sidebar.classList.contains('open') ? "✕ 닫기" : "☰ 메뉴 열기";
        }

        function toggleSidebarRight() {
            const sidebar = document.getElementById('sidebar_right');
            const toggleBtn = document.getElementById('menu-toggle_right');
            sidebar.classList.toggle('open');
            toggleBtn.innerText = sidebar.classList.contains('open') ? "✕ 닫기" : "☰ 파츠 투명도";
        }

        const searchInput = document.getElementById('charSearch');
        const optionsList = document.getElementById('options-list');
        const optionItems = document.querySelectorAll('.option-item');

        searchInput.addEventListener('click', () => {
            optionsList.classList.add('show');
        });

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.search-container')) {
                optionsList.classList.remove('show');
            }
        });

        searchInput.addEventListener('input', function() {
            const filter = this.value.toLowerCase();
            optionsList.classList.add('show');
            
            optionItems.forEach(item => {
                const text = item.textContent.toLowerCase();
                if (text.includes(filter)) {
                    item.classList.remove('hidden');
                } else {
                    item.classList.add('hidden');
                }
            });
        });

        optionItems.forEach(item => {
            item.addEventListener('click', function() {
                const val = this.getAttribute('data-value');
                const name = this.textContent;
                
                selectedCharacter = val;
                searchInput.value = name;
                optionsList.classList.remove('show');
                
                loadSpine();
            });
        });

        async function initCharacterList() {
            try {
                const response = await fetch('Characters.json');
                const data = await response.json();
                
                const listContainer = document.getElementById('options-list');
                const searchInput = document.getElementById('charSearch');

                listContainer.innerHTML = '';

                data.characters.forEach(char => {
                    const div = document.createElement('div');
                    div.className = 'option-item';
                    div.setAttribute('data-value', char.id);
                    
                    div.innerHTML = `<span>${char.name}</span>`;

                    if (char.new === true) {
                        const span = div.querySelector('span');
                        if (span) span.style.color = "red";
                    }

                    div.onclick = () => {
                        selectedCharacter = char.id;
                        searchInput.value = char.name;
                        listContainer.classList.remove('show');
                        loadSpine();
                    };

                    listContainer.appendChild(div);
                });

                const optionItems = listContainer.querySelectorAll('.option-item');

                searchInput.addEventListener('click', () => {
                    listContainer.classList.add('show');
                });

                document.addEventListener('click', (e) => {
                    if (!e.target.closest('.search-container')) {
                        listContainer.classList.remove('show');
                    }
                });

                searchInput.addEventListener('input', function () {
                    const filter = this.value.toLowerCase();
                    listContainer.classList.add('show');

                    optionItems.forEach(item => {
                        const spanText = item.querySelector('span')?.textContent || '';
                        const text = spanText.toLowerCase();
                        
                        if (text.includes(filter)) {
                            item.classList.remove('hidden');
                        } else {
                            item.classList.add('hidden');
                        }
                    });
                });

            } catch (error) {
                console.error("데이터 로드 실패:", error);
            }
        }

        function buildSlotOpacityList(p) {
            const container = document.getElementById('slot-sliders-container');
            container.innerHTML = '';

            const slots = p.skeleton.slots;

            slots.forEach(slot => {
                if (!slot.data.name) return;

                const slotWrapper = document.createElement('div');
                slotWrapper.style.marginBottom = "13px";

                const label = document.createElement('div');
                label.style.fontSize = "12px";
                label.style.marginBottom = "4px";
                label.style.color = "#ccc";
                label.textContent = slot.data.name;

                const slider = document.createElement('input');
                slider.type = "range";
                slider.min = "0";
                slider.max = "1";
                slider.step = "0.01";
                slider.value = slot.color.a;
                slider.style.width = "100%";

                slider.oninput = (e) => {
                    const alpha = parseFloat(e.target.value);
                    slot.color.a = alpha;
                };

                slotWrapper.appendChild(label);
                slotWrapper.appendChild(slider);
                container.appendChild(slotWrapper);
            });
        }

        function enableCanvasDrag() {
            const container = document.getElementById("player-container");
            let dragging = false;
            let startX = 0, startY = 0;
            let offsetX = 0, offsetY = 0;

            container.addEventListener("mousedown", e => {
                dragging = true;
                startX = e.clientX;
                startY = e.clientY;
                container.style.cursor = "grabbing";
            });

            window.addEventListener("mousemove", e => {
                if (!dragging) return;

                const dx = e.clientX - startX;
                const dy = e.clientY - startY;

                container.style.transform =
                `translate(${offsetX + dx}px, ${offsetY + dy}px)`;
            });

            window.addEventListener("mouseup", () => {
                if (!dragging) return;
                dragging = false;

                const transform = container.style.transform;
                const match = transform.match(/translate\(([-\d.]+)px,\s*([-\d.]+)px\)/);

                if (match) {
                offsetX = parseFloat(match[1]);
                offsetY = parseFloat(match[2]);
                }

                container.style.cursor = "grab";
            });
            }
        enableCanvasDrag();

        function enableCanvasTouchGestures() {
            const container = document.getElementById("player-container");

            let dragging = false;
            let startX = 0, startY = 0;
            let offsetX = 0, offsetY = 0;
            let pinchStartDist = null;
            let scale = 0.5;

            function currentOffset() {
                const match = container.style.transform.match(/translate\(([-\d.]+)px,\s*([-\d.]+)px\)/);
                return match ? { x: parseFloat(match[1]), y: parseFloat(match[2]) } : { x: offsetX, y: offsetY };
            }

            function touchDistance(touches) {
                const dx = touches[0].clientX - touches[1].clientX;
                const dy = touches[0].clientY - touches[1].clientY;
                return Math.hypot(dx, dy);
            }

            container.addEventListener("touchstart", e => {
                if (e.touches.length === 1) {
                    dragging = true;
                    const off = currentOffset();
                    offsetX = off.x;
                    offsetY = off.y;
                    startX = e.touches[0].clientX;
                    startY = e.touches[0].clientY;
                } else if (e.touches.length === 2) {
                    dragging = false;
                    pinchStartDist = touchDistance(e.touches);
                }
            }, { passive: false });

            container.addEventListener("touchmove", e => {
                e.preventDefault();

                if (e.touches.length === 1 && dragging) {
                    const dx = e.touches[0].clientX - startX;
                    const dy = e.touches[0].clientY - startY;
                    container.style.transform = `translate(${offsetX + dx}px, ${offsetY + dy}px)`;
                } else if (e.touches.length === 2 && player && player.canvas) {
                    const newDist = touchDistance(e.touches);
                    if (pinchStartDist) {
                        const delta = (newDist - pinchStartDist) * 0.001;
                        scale = Math.min(Math.max(scale + delta, 0.1), 2.0);
                        player.canvas.style.transform = `scale(${scale})`;
                    }
                    pinchStartDist = newDist;
                }
            }, { passive: false });

            container.addEventListener("touchend", e => {
                if (e.touches.length === 0) {
                    dragging = false;
                    pinchStartDist = null;
                } else if (e.touches.length === 1) {
                    dragging = true;
                    const off = currentOffset();
                    offsetX = off.x;
                    offsetY = off.y;
                    startX = e.touches[0].clientX;
                    startY = e.touches[0].clientY;
                }
            });
        }
        enableCanvasTouchGestures();

        function enableCanvasWheelScale(p) {
            let scale = 0.5;

            const container = document.getElementById("player-container");

            container.addEventListener("wheel", e => {
                e.preventDefault();

                const canvases = container.querySelectorAll("canvas");
                if (!canvases.length) return;

                scale += (e.deltaY < 0 ? 0.02 : -0.02);
                scale = Math.min(Math.max(scale, 0.1), 2.0);

                p.canvas.style.transform = `scale(${scale})`;
            }, { passive: false });
        }

        function buildAnimationList(player) {
            const list = document.getElementById("animation-list");
            list.innerHTML = "";

            const animations = player.skeleton.data.animations;
            const animNames = animations.map(a => a.name);

            const processedBases = new Set();

            animations.forEach(anim => {
                const name = anim.name;
                
                const match = name.match(/(.+?)(_[AM])/);
                let displayName = name;
                let isSet = false;
                let baseName = name;

                if (match) {
                    baseName = match[1];
                    displayName = baseName;
                    isSet = true;
                    
                    if (processedBases.has(baseName)) return;
                    processedBases.add(baseName);
                }

                const btn = document.createElement("button");
                btn.textContent = displayName;

                btn.onclick = () => {
                    Array.from(list.children).forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');

                    if (isSet) {
                        const animM = baseName + "_M";
                        const animA = baseName + "_A";

                        player.animationState.setAnimation(1, animM, true);
                        if (animNames.includes(animA)) {
                            player.animationState.setAnimation(2, animA, true);
                        }
                    }
                    else {
                        player.animationState.setAnimation(1, name, true);
                        player.animationState.setEmptyAnimation(2, 0.2);
                    }
                };
                list.appendChild(btn);
            });
        }

        async function takeScreenshot() {
            const container = document.getElementById('player-container');
            const canvas = container.querySelector('canvas');

            if (!player || !canvas) {
                alert("플레이어를 찾을 수 없습니다.");
                return;
            }

            const gl = canvas.getContext("webgl2", { preserveDrawingBuffer: true }) || 
                    canvas.getContext("webgl", { preserveDrawingBuffer: true});

            if (!gl) {
                alert("WebGL 컨텍스트를 사용할 수 없습니다.");
                return;
            }

            requestAnimationFrame(() => {
                const width = canvas.width;
                const height = canvas.height;
                const pixels = new Uint8Array(width * height * 4);
                
                gl.readPixels(0, 0, width, height, gl.RGBA, gl.UNSIGNED_BYTE, pixels);

                let minX = width, minY = height, maxX = 0, maxY = 0;
                let found = false;

                for (let y = 0; y < height; y++) {
                    for (let x = 0; x < width; x++) {
                        const index = (y * width + x) * 4;
                        if (pixels[index + 3] > 0) {
                            if (x < minX) minX = x;
                            if (x > maxX) maxX = x;
                            if (y < minY) minY = y;
                            if (y > maxY) maxY = y;
                            found = true;
                        }
                    }
                }

                if (!found) {
                    alert("실패");
                    return;
                }

                const padding = 20;
                const cropWidth = Math.min(width, (maxX - minX) + (padding * 2));
                const cropHeight = Math.min(height, (maxY - minY) + (padding * 2));

                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = cropWidth;
                tempCanvas.height = cropHeight;
                const tempCtx = tempCanvas.getContext('2d');

                const sourceX = Math.max(0, minX - padding);
                const sourceY = Math.max(0, height - maxY - padding);

                tempCtx.drawImage(
                    canvas,
                    sourceX, sourceY, cropWidth, cropHeight,
                    0, 0, cropWidth, cropHeight
                );

                const link = document.createElement('a');
                link.download = `${selectedCharacter}.png`;
                link.href = tempCanvas.toDataURL("image/png");
                link.click();
            });
        }

        function loadSpine() {
            const container = document.getElementById('player-container');
            container.innerHTML = '';

            player = new spine.SpinePlayer("player-container", {
                binary: true,
                skelUrl: `https://raw.githubusercontent.com/asdfdsa12/BA-Spine-Viewer-Asset/main/old/assets/${selectedCharacter}.skel`, 
                atlasUrl: `https://raw.githubusercontent.com/asdfdsa12/BA-Spine-Viewer-Asset/main/old/assets/${selectedCharacter}.atlas`,
                showControls: false,
                premultipliedAlpha: false,
                backgroundColor: "#00000000",
                alpha: false,
                preserveDrawingBuffer: true,
                showLoading: false,
                viewport: {
                    autoSize: true,
                    padLeft: "1%", padRight: "1%", padTop: "1%", padBottom: "1%"
                },
                success: function(p) {
                    enableCanvasWheelScale(p);
                    try{
                        p.animationState.setAnimation(0, "Idle_01", true);
                    }
                    catch(e){
                        p.animationState.setAnimation(0, "00", true);
                    }
                    buildAnimationList(p);
                    buildSlotOpacityList(p);
                }
            });
        }
        window.onload = () => {
            initCharacterList();
            loadSpine();
        };
    </script>
</body>
</html>
