<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>BA Spine Viewer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/@esotericsoftware/spine-player@4.2.*/dist/spine-player.css">
    <link rel="icon" href="../favicon.ico">
    <style>
        body { background: #1a1a1a; color: #eee; font-family: sans-serif; margin: 0; overflow: hidden; display: flex; }

        #sidebar {
            position: fixed;
            top: 0;
            left: -320px;
            width: 300px;
            height: 100vh;
            background: #252525;
            box-shadow: 5px 0 15px rgba(0,0,0,0.5);
            transition: left 0.3s ease;
            z-index: 1000;
            padding: 60px 20px 20px 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        #sidebar_right {
            position: fixed;
            top: 0; 
            right: -320px;
            width: 280px;
            height: 100vh;
            background: #252525;
            box-shadow: 5px 0 15px rgba(0,0,0,0.5);
            transition: right 0.3s ease;
            z-index: 1000;
            padding: 60px 20px 20px 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 15px;
            
        }

        #sidebar.open { left: 0; }
        #sidebar_right.open { right: 0; }

        #menu-toggle {
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 1001;
            background: #2b6cb0;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        #menu-toggle_right {
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 1001;
            background: #2b6cb0;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        #player-container { 
            width: 100vw;
            height: 100vh; 
            background-color: #1a1a1a;
        }

        #player-container canvas {
            position: absolute;
            width: 200% !important;
            height: 200% !important;
            transform: scale(0.5);
            transform-origin: top left;
        }

        .search-container { position: relative; width: 100%; }
        #charSearch { 
            width: 100%; padding: 12px; border-radius: 4px; background: #444; 
            color: white; border: 1px solid #666; outline: none; box-sizing: border-box;
        }
        .options-list { 
            position: absolute; top: 50px; left: 0; width: 100%; max-height: 600px; 
            background: #333; border: 1px solid #555; border-radius: 4px; 
            overflow-y: auto; z-index: 1100; display: none;
        }

        .options-list.show { 
            display: block; 
        }

        .option-item { 
            padding: 12px 8px; 
            cursor: pointer; 
            font-size: 13px; 
            background: #333; 
            
            display: flex;
            align-items: center;    
            justify-content: center;
            gap: 8px;
        }

        .option-thumb {
            width: 60px;          
            height: 60px;         
            border-radius: 6px;   
            object-fit: cover;    
            background: #222;     
            flex-shrink: 0;       
        }

        .option-item span {
            width: 100%;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 15px;
        }

        .option-item:hover { 
            background: #2b6cb0; 
        }

        .option-item.hidden { 
            display: none !important;
        }

        .btn-group { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
        button.action-btn { padding: 12px; border-radius: 4px; border: none; cursor: pointer; color: white; background: #555; font-weight: bold; width: 100%; }
        button.action-btn:hover { background: #666; }
        .anim-container-wrapper {
            background: #333;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #444;
            margin-top: 10px;
        }

        #animation-list {
            max-height: 150px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        #animation-list::-webkit-scrollbar { width: 6px; }
        #animation-list::-webkit-scrollbar-thumb {
            background: #555;
            border-radius: 10px;
        }

        #animation-list button {
            width: 100%;
            min-height: 30px; 
            padding: 0 15px;
            
            background: #444;
            color: #eee;
            border: 1px solid #555;
            border-radius: 4px;
            cursor: pointer;
            
            display: flex;
            align-items: center;
            justify-content: flex-start;
            
            font-size: 14px;
            font-weight: bold;
            line-height: 1;
            
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: all 0.2s;
        }

        #animation-list button:hover {
            background: #3a3a3a;
            border-color: #2b6cb0;
        }

        #animation-list button.active {
            background: #2b6cb0;
            border-color: #63b3ed;
            color: #ffffff;
        }

        #diorama-list {
            max-height: 200px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        #diorama-list::-webkit-scrollbar { width: 6px; }
        #diorama-list::-webkit-scrollbar-thumb {
            background: #555;
            border-radius: 10px;
        }

        #diorama-list button {
            width: 100%;
            min-height: 30px; 
            padding: 0 15px;
            
            background: #444;
            color: #eee;
            border: 1px solid #555;
            border-radius: 4px;
            cursor: pointer;
            
            display: flex;
            align-items: center;
            justify-content: flex-start;
            
            font-size: 14px;
            font-weight: bold;
            line-height: 1;
            
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: all 0.2s;
        }

        #diorama-list button:hover {
            background: #3a3a3a;
            border-color: #2b6cb0;
        }

        #diorama-list button.active {
            background: #2b6cb0;
            border-color: #63b3ed;
            color: #ffffff;
        }

    </style>
</head>
<body>

    <button id="menu-toggle" onclick="toggleSidebar()">☰ 전체 설정</button>
    <button id="menu-toggle_right" onclick="toggleSidebarRight()">☰ 파츠 투명도</button>
    
    <div id="sidebar_right">
        <div class="anim-container-wrapper">
            <div id="slot-sliders-container" style="overflow-y: auto; max-height: 80vh; padding-right: 20px;">
            </div>
        </div>
    </div>

    <div id="sidebar">
        <label>캐릭터 검색: </label>

        <div class="search-container">
            <input type="text" id="charSearch" placeholder="이름 입력..." autocomplete="off">
            <div id="options-list" class="options-list"></div>
        </div>

        <button onclick="toggleFullscreen()" style="height: 30px; font-size: 15px">
            전체화면
        </button>
        <button onclick="takeScreenshot()" style="height: 30px; font-size: 15px">이미지 다운로드</button>
        <div class="anim-container-wrapper">
            <div class="slider-header" style="margin-bottom: 10px;">
                <span>애니메이션 목록</span>
            </div>
            <div id="animation-list"></div>
        </div>
        <div class="anim-container-wrapper">
            <div class="slider-header" style="margin-bottom: 10px;">
                <span>배경 교체 (일부 캐릭터 한정)</span>
            </div>
            <div id="diorama-list"></div>
        </div>
        <button onclick="location.href='../'" style="height: 30px; font-size:15px">메인으로</button>
    </div>

    <div id="viewer-container">
        <div id="player-container"></div>
    </div>

    <script src="https://unpkg.com/@esotericsoftware/spine-player@4.2.*/dist/iife/spine-player.js"></script>
    
    <script>
        let player = null;
        let selectedCharacter = "CH0374_spr";
        const isMobile = window.matchMedia("(pointer: coarse)").matches;

        let currentAudio = null;

        let url = `https://raw.githubusercontent.com/asdfdsa12/BA-Spine-Viewer-Asset/main/new/assets`;

        async function initCharacterList() {
            try {
                const response = await fetch('Characters.json');
                const data = await response.json();
                
                const listContainer = document.getElementById('options-list');
                const searchInput = document.getElementById('charSearch');

                listContainer.innerHTML = '';

                data.characters.forEach(char => {
                    const div = document.createElement('div');
                    div.className = 'option-item';
                    div.setAttribute('data-value', char.id);
                    
                    div.innerHTML = `
                        <img src="${url}/icons/Portrait_${char.id.replace('_spr','')}.png" class="option-thumb" onerror="console.clear(); this.remove()"">
                        <span>${char.name}</span>
                    `;

                    if (char.new === true) {
                        const span = div.querySelector('span');
                        if (span) span.style.color = "red";
                    }

                    div.onclick = () => {
                        selectedCharacter = char.id;
                        searchInput.value = char.name;
                        listContainer.classList.remove('show');
                        loadSpine();
                    };

                    listContainer.appendChild(div);
                });

                const optionItems = listContainer.querySelectorAll('.option-item');

                searchInput.addEventListener('click', () => {
                    listContainer.classList.add('show');
                });

                document.addEventListener('click', (e) => {
                    if (!e.target.closest('.search-container')) {
                        listContainer.classList.remove('show');
                    }
                });

                searchInput.addEventListener('input', function () {
                    const filter = this.value.toLowerCase();
                    listContainer.classList.add('show');

                    optionItems.forEach(item => {
                        const spanText = item.querySelector('span')?.textContent || '';
                        const text = spanText.toLowerCase();
                        
                        if (text.includes(filter)) {
                            item.classList.remove('hidden');
                        } else {
                            item.classList.add('hidden');
                        }
                    });
                });

            } catch (error) {
                console.error("데이터 로드 실패:", error);
            }
        }

        function buildSlotOpacityList(p) {
            const container = document.getElementById('slot-sliders-container');
            container.innerHTML = '';

            const slots = p.skeleton.slots;

            slots.forEach(slot => {
                if (!slot.data.name) return;

                const slotWrapper = document.createElement('div');
                slotWrapper.style.marginBottom = "13px";

                const label = document.createElement('div');
                label.style.fontSize = "12px";
                label.style.marginBottom = "4px";
                label.style.color = "#ccc";
                label.textContent = slot.data.name;

                const slider = document.createElement('input');
                slider.type = "range";
                slider.min = "0";
                slider.max = "1";
                slider.step = "0.01";
                slider.value = slider.max
                slider.style.width = "100%";

                slider.oninput = (e) => {
                    const alpha = parseFloat(e.target.value);
                    if(slot.attachment)
                        slot.attachment.color.a = alpha;
                    else
                        slot.color.a=alpha;
                };

                slotWrapper.appendChild(label);
                slotWrapper.appendChild(slider);
                container.appendChild(slotWrapper);
            });
        }

        function enableCanvasDrag() {
            const container = document.getElementById("player-container");
            let dragging = false;
            let startX = 0, startY = 0;
            let offsetX = 0, offsetY = 0;

            container.addEventListener("mousedown", e => {
                dragging = true;
                startX = e.clientX;
                startY = e.clientY;
                container.style.cursor = "grabbing";
            });

            window.addEventListener("mousemove", e => {
                if (!dragging) return;

                const dx = e.clientX - startX;
                const dy = e.clientY - startY;

                container.style.transform =
                `translate(${offsetX + dx}px, ${offsetY + dy}px)`;
            });

            window.addEventListener("mouseup", () => {
                if (!dragging) return;
                dragging = false;

                const transform = container.style.transform;
                const match = transform.match(/translate\(([-\d.]+)px,\s*([-\d.]+)px\)/);

                if (match) {
                offsetX = parseFloat(match[1]);
                offsetY = parseFloat(match[2]);
                }

                container.style.cursor = "grab";
            });
            }
        enableCanvasDrag();

        function enableCanvasWheelScale(p) {
            let scale = 0.5;

            const container = document.getElementById("player-container");

            container.addEventListener("wheel", e => {
                e.preventDefault();

                const canvases = container.querySelectorAll("canvas");
                if (!canvases.length) return;

                scale += (e.deltaY < 0 ? 0.02 : -0.02);
                scale = Math.min(Math.max(scale, 0.1), 2.0);

                p.canvas.style.transform = `scale(${scale})`;
            }, { passive: false });
        }

        function buildAnimationList(player) {
            const list = document.getElementById("animation-list");
            list.innerHTML = "";

            const animations = player.skeleton.data.animations;
            const animNames = animations.map(a => a.name);

            const processedBases = new Set();

            animations.forEach(anim => {
                const name = anim.name;
                
                const match = name.match(/(.+?)(_[AM])/);
                let displayName = name;
                let isSet = false;
                let baseName = name;

                if (match) {
                    baseName = match[1];
                    displayName = baseName;
                    isSet = true;
                    
                    if (processedBases.has(baseName)) return;
                    processedBases.add(baseName);
                }

                const btn = document.createElement("button");
                btn.textContent = displayName;

                btn.onclick = () => {
                    if (currentAudio) {
                        currentAudio.pause();
                        currentAudio.src="";
                        currentAudio = null;
                    }
                    Array.from(list.children).forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');

                    if (isSet) {
                        const animM = baseName + "_M";
                        const animA = baseName + "_A";

                        player.animationState.setAnimation(1, animM, true);
                        if (animNames.includes(animA)) {
                            player.animationState.setAnimation(2, animA, true);
                        }
                    }
                    else {
                        player.animationState.setAnimation(1, name, true);
                        player.animationState.setEmptyAnimation(2, 0.2);
                    }
                };
                list.appendChild(btn);
            });
        }

        function buildDioramaList(player) {
            const list = document.getElementById("diorama-list");
            if (!list) return;
            list.innerHTML = "";

            const skins = player.skeleton.data.skins;
            const skinNames = skins.map(s => s.name);

            const dioramaSkins = skinNames.filter(name => 
                name.toLowerCase().includes("diorama")
            );

            const defaultBtn = document.createElement("button");
            defaultBtn.textContent = "default";
            defaultBtn.classList.add("active");
            defaultBtn.onclick = () => {
                updateDioramaActive(defaultBtn);
                player.skeleton.setSkinByName("default");
                player.skeleton.setSlotsToSetupPose();
            };
            list.appendChild(defaultBtn);

            dioramaSkins.forEach(skinName => {
                const btn = document.createElement("button");
                btn.textContent = skinName;

                btn.onclick = () => {
                    updateDioramaActive(btn);
                    
                    player.skeleton.setSkinByName(skinName);
                    player.skeleton.setSlotsToSetupPose();
                };
                list.appendChild(btn);
            });

            function updateDioramaActive(activeBtn) {
                Array.from(list.children).forEach(b => b.classList.remove('active'));
                activeBtn.classList.add('active');
            }
        }

        function toggleFullscreen() {
            const container = document.getElementById('player-container');

            if (!document.fullscreenElement) {
                if (container.requestFullscreen) {
                container.requestFullscreen();
                } else if (container.webkitRequestFullscreen) {
                container.webkitRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                document.webkitExitFullscreen();
                }
            }
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const toggleBtn = document.getElementById('menu-toggle');
            sidebar.classList.toggle('open');
            toggleBtn.innerText = sidebar.classList.contains('open') ? "✕ 닫기" : "☰ 전체 설정";
        }
        function toggleSidebarRight() {
            const sidebar = document.getElementById('sidebar_right');
            const toggleBtn = document.getElementById('menu-toggle');
            sidebar.classList.toggle('open');
            toggleBtn.innerText = sidebar.classList.contains('open') ? "✕ 닫기" : "☰ 전체 설정";
        }

        const searchInput = document.getElementById('charSearch');
        const optionsList = document.getElementById('options-list');
        const optionItems = document.querySelectorAll('.option-item');

        searchInput.addEventListener('click', () => {
            optionsList.classList.add('show');
        });

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.search-container')) {
                optionsList.classList.remove('show');
            }
        });

        searchInput.addEventListener('input', function() {
            const filter = this.value.toLowerCase();
            optionsList.classList.add('show');
            
            optionItems.forEach(item => {
                const text = item.textContent.toLowerCase();
                if (text.includes(filter)) {
                    item.classList.remove('hidden');
                } else {
                    item.classList.add('hidden');
                }
            });
        });

        searchInput.addEventListener('input', function() {
            const filter = this.value.toLowerCase();
            optionsList.classList.add('show');
            
            optionItems.forEach(item => {
                const text = item.textContent.toLowerCase();
                if (text.includes(filter)) {
                    item.classList.remove('hidden');
                } else {
                    item.classList.add('hidden');
                }
            });
        });

        async function takeScreenshot() {
            const canvas = document.querySelector('#player-container canvas');
            if (!player || !canvas) return;

            const gl = canvas.getContext("webgl2", { preserveDrawingBuffer: true }) || 
                    canvas.getContext("webgl", { preserveDrawingBuffer: true });
            
            const width = canvas.width;
            const height = canvas.height;
            
            const pixels = new Uint8Array(width * height * 4);
            
            gl.readPixels(0, 0, width, height, gl.RGBA, gl.UNSIGNED_BYTE, pixels);

            let minX = width, minY = height, maxX = 0, maxY = 0;
            let found = false;

            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    const index = (y * width + x) * 4;
                    const alpha = pixels[index + 3];
                    if (alpha > 5) {
                        if (x < minX) minX = x;
                        if (x > maxX) maxX = x;
                        if (y < minY) minY = y;
                        if (y > maxY) maxY = y;
                        found = true;
                    }
                }
            }

            if (!found) {
                alert("이미지를 감지할 수 없습니다.");
                return;
            }

            const padding = 5;
            const cropWidth = (maxX - minX) + (padding * 2);
            const cropHeight = (maxY - minY) + (padding * 2);

            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = cropWidth;
            tempCanvas.height = cropHeight;
            const tempCtx = tempCanvas.getContext('2d');

            tempCtx.drawImage(
                canvas,
                minX - padding, height - maxY - padding, cropWidth, cropHeight,
                0, 0, cropWidth, cropHeight
            );

            const link = document.createElement('a');
            link.download = `${selectedCharacter}_${Date.now()}.png`;
            link.href = tempCanvas.toDataURL("image/png");
            link.click();
        }

        function playSfx(selectedCharacter,fileName) {
            const charCodeMatch = fileName.match(/^(.+?)(?=_)/i);
            const folderName = charCodeMatch ? charCodeMatch[1] : fileName.split('_')[0];

            const audioPath = `https://raw.githubusercontent.com/asdfdsa12/BA-Spine-Viewer-Asset/main/new/audio/${folderName}/${fileName}.ogg`;
            currentAudio = new Audio(audioPath);
            
            currentAudio.volume = 0.5;
            currentAudio.play().catch(err => {
                console.warn("123", err);
            });
        }

        function loadSpine() {
            const container = document.getElementById('player-container');
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.src="";
                currentAudio = null;
            }
            if (player) {
                player.dispose();
                player=null;
            }

            container.innerHTML = '';

            player = new spine.SpinePlayer("player-container", {
                skelUrl: `https://raw.githubusercontent.com/asdfdsa12/BA-Spine-Viewer-Asset/main/new/assets/${selectedCharacter}.skel`, 
                atlasUrl: `https://raw.githubusercontent.com/asdfdsa12/BA-Spine-Viewer-Asset/main/new/assets/${selectedCharacter}.atlas`,
                showControls: false,
                premultipliedAlpha: false,
                backgroundColor: "#00000000",
                alpha: true,
                preserveDrawingBuffer: true,
                viewport: {
                    autoSize: true,
                    padLeft: "1%", padRight: "1%", padTop: "1%", padBottom: "1%"
                },
                success: function(p) {
                    enableCanvasWheelScale(p);
                    try{
                    p.animationState.setAnimation(0, "Idle_01", true);
                    }
                    catch(e){
                        p.animationState.setAnimation(0, "00", true);
                    }
                    p.animationState.addListener({
                        event: function(entry, event) {
                            if (event.data.name === "Talk" && p === player) {
                                const audioFileName = event.stringValue ? event.stringValue.toLowerCase() : null;
                                if (audioFileName) playSfx(selectedCharacter,audioFileName);
                            }
                        }
                    });
                    if(!isMobile){
                        p.canvas.style.transformOrigin = "center center";
                        p.canvas.style.width = "200% !important";
                        p.canvas.style.height = "200% !important";
                        p.canvas.style.left = "-50%";
                        p.canvas.style.top = "-50%";
                        p.canvas.style.transform = "scale(0.5);";
                    }
                    buildAnimationList(p);
                    buildDioramaList(p);
                    buildSlotOpacityList(p);
                }
            });
        }
        window.onload = () => {
            initCharacterList();
            loadSpine();
        };
    </script>
</body>
</html>
